<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#111"/>
  <!-- Crosshair lines under ring -->
  <line x1="16" y1="1" x2="16" y2="31" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="1" y1="16" x2="31" y2="16" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Rainbow ring: 12 segments, 30° each, outerR=13, innerR=8 -->
  <!-- 0°: red -->  <path d="M16,3 A13,13 0 0,1 22.5,5.5 L19.5,8.5 A8,8 0 0,0 16,8 Z" fill="#ff0000"/>
  <!-- 30°: orange --> <path d="M22.5,5.5 A13,13 0 0,1 28,12.5 L24,14 A8,8 0 0,0 19.5,8.5 Z" fill="#ff8000"/>
  <!-- 60°: yellow --> <path d="M28,12.5 A13,13 0 0,1 29,16 L24,16 A8,8 0 0,0 24,14 Z" fill="#ffff00"/>
  <!-- 90°: yellow-green --> <path d="M29,16 A13,13 0 0,1 28,19.5 L24,18 A8,8 0 0,0 24,16 Z" fill="#80ff00"/>
  <!-- 120°: green --> <path d="M28,19.5 A13,13 0 0,1 22.5,26.5 L19.5,23.5 A8,8 0 0,0 24,18 Z" fill="#00ff00"/>
  <!-- 150°: spring green --> <path d="M22.5,26.5 A13,13 0 0,1 16,29 L16,24 A8,8 0 0,0 19.5,23.5 Z" fill="#00ff80"/>
  <!-- 180°: cyan --> <path d="M16,29 A13,13 0 0,1 9.5,26.5 L12.5,23.5 A8,8 0 0,0 16,24 Z" fill="#00ffff"/>
  <!-- 210°: azure --> <path d="M9.5,26.5 A13,13 0 0,1 4,19.5 L8,18 A8,8 0 0,0 12.5,23.5 Z" fill="#0080ff"/>
  <!-- 240°: blue --> <path d="M4,19.5 A13,13 0 0,1 3,16 L8,16 A8,8 0 0,0 8,18 Z" fill="#0000ff"/>
  <!-- 270°: violet --> <path d="M3,16 A13,13 0 0,1 4,12.5 L8,14 A8,8 0 0,0 8,16 Z" fill="#8000ff"/>
  <!-- 300°: magenta --> <path d="M4,12.5 A13,13 0 0,1 9.5,5.5 L12.5,8.5 A8,8 0 0,0 8,14 Z" fill="#ff00ff"/>
  <!-- 330°: rose --> <path d="M9.5,5.5 A13,13 0 0,1 16,3 L16,8 A8,8 0 0,0 12.5,8.5 Z" fill="#ff0080"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="3" fill="white"/>
</svg>
